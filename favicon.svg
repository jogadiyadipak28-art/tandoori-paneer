<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Dark background circle -->
    <radialGradient id="bgGrad" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#3d1a08"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <!-- Flame outer gradient: deep red → orange -->
    <radialGradient id="flameOuter" cx="50%" cy="80%" r="60%">
      <stop offset="0%"   stop-color="#e67e22"/>
      <stop offset="55%"  stop-color="#d35400"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <!-- Flame inner highlight: bright yellow-white core -->
    <radialGradient id="flameInner" cx="50%" cy="75%" r="45%">
      <stop offset="0%"   stop-color="#fff8dc"/>
      <stop offset="40%"  stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bgGrad)"/>
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#e67e22" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Outer flame shape -->
  <path filter="url(#glow)"
    d="M16 27
       C10 27 7 23 7 19
       C7 16 9 14.5 9.5 12.5
       C10 10.5 9.5 8.5 9.5 8.5
       C11 10 11.5 11.5 12 12
       C12.5 8 14 5 16 4
       C15.5 7 16.5 9 17.5 10
       C18 8.5 18.5 7 19 6
       C21 8.5 22.5 11 22 14
       C22.5 13.5 23 13 23.5 12.5
       C24.5 15 25 17 25 19
       C25 23 22 27 16 27Z"
    fill="url(#flameOuter)"/>

  <!-- Inner flame highlight -->
  <path
    d="M16 25
       C12.5 25 11 22.5 11 20
       C11 18 12 16.5 12.5 15
       C13 16 13.5 17 14 17.5
       C14 15 14.5 12.5 16 11
       C15.8 13 16.5 14.5 17.5 15.5
       C18 14 18.5 12.5 18.5 12.5
       C20 14.5 21 17 21 20
       C21 22.5 19.5 25 16 25Z"
    fill="url(#flameInner)" opacity="0.85"/>

  <!-- Tiny ember dots at base -->
  <circle cx="13" cy="25.5" r="0.9" fill="#e67e22" opacity="0.7"/>
  <circle cx="16" cy="26.5" r="0.8" fill="#f39c12" opacity="0.6"/>
  <circle cx="19" cy="25.5" r="0.9" fill="#e67e22" opacity="0.7"/>
</svg>
